# HAVEN Android — Gradle properties

# AndroidX migration (required for Compose + modern AndroidX libraries)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Jetpack Compose compiler metrics (disable in production for faster builds)
# android.enableComposeCompilerMetrics=false

# Increase Gradle daemon JVM heap for large Kotlin/Compose compilations
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle configuration cache (speeds up subsequent builds)
org.gradle.configuration-cache=false

# Enable parallel project execution
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true
