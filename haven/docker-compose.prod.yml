version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: haven-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: haven-frontend-prod
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    restart: always
